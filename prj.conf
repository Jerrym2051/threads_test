CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# CAN controller API + STM32 bxCAN driver (can1, enabled in app.overlay)
CONFIG_CAN=y

# CRC library (crc32_ieee used by the worker thread)
CONFIG_CRC=y

# Loopback mode is selected at runtime with can_set_mode(CAN_MODE_LOOPBACK);
# the bxCAN driver sets the LBKM bit. No CONFIG_CAN transceiver needed.
